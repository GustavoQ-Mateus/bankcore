basePath: /
definitions:
  account.Account:
    properties:
      balance_cents:
        type: integer
      created_at:
        type: string
      id:
        type: string
      number:
        type: string
      owner_id:
        type: string
      status:
        $ref: '#/definitions/account.Status'
      version:
        type: integer
    type: object
  account.Status:
    enum:
    - ACTIVE
    - BLOCKED
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusBlocked
  account.amountRequest:
    properties:
      amount:
        type: string
    type: object
  account.statusRequest:
    properties:
      status:
        $ref: '#/definitions/account.Status'
    type: object
  auth.Customer:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/auth.Role'
    type: object
  auth.Role:
    enum:
    - CUSTOMER
    - ADMIN
    - SETTLEMENT
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleAdmin
    - RoleSettlement
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/auth.Role'
    type: object
  auth.tokenRequest:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
    type: object
  transfer.Status:
    enum:
    - PENDING
    - SETTLED
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusSettled
    - StatusFailed
  transfer.Transfer:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      from_account_id:
        type: string
      id:
        type: string
      settled_at:
        type: string
      settlement_ref:
        type: string
      status:
        $ref: '#/definitions/transfer.Status'
      to_account_id:
        type: string
    type: object
  transfer.settleRequest:
    properties:
      settlement_ref:
        type: string
    type: object
  transfer.transferRequest:
    properties:
      amount:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Núcleo bancário em Go: contas, depósitos, saques e transferências
    atômicas com ledger append-only. Valores entram/saem em decimal e são operados
    em centavos int64. v1.1.0 adiciona a fronteira de liquidação com o Liquida (ADR
    0004); v1.2.0 fecha o cadastro público de administrador (gate ALLOW_PUBLIC_ADMIN_REGISTER
    + seed do 1º admin).'
  title: BankCore API
  version: 1.2.0
paths:
  /accounts:
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/account.Account'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Abrir conta
      tags:
      - accounts
  /accounts/{id}:
    get:
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.Account'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Consultar conta e saldo
      tags:
      - accounts
  /accounts/{id}/deposit:
    post:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: valor decimal
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.amountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Depósito
      tags:
      - accounts
  /accounts/{id}/statement:
    get:
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Extrato paginado
      tags:
      - accounts
  /accounts/{id}/withdraw:
    post:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: valor decimal
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.amountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Saque
      tags:
      - accounts
  /admin/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/account.Account'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar contas (ADMIN)
      tags:
      - admin
  /admin/accounts/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: novo status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.statusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.Account'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Bloquear/desbloquear conta (ADMIN)
      tags:
      - admin
  /admin/service-clients:
    post:
      description: Gera client_id/client_secret para o Liquida. O client_secret é
        exibido UMA ÚNICA VEZ.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Provisionar credencial de serviço (ADMIN)
      tags:
      - admin
  /admin/transfers:
    get:
      parameters:
      - description: PENDING, SETTLED ou FAILED
        in: query
        name: status
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar transferências por status (ADMIN)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login e emissão de JWT
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: dados do cliente
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Registrar cliente
      tags:
      - auth
  /auth/token:
    post:
      consumes:
      - application/json
      description: 'Fluxo M2M do Liquida: troca client_id/client_secret por um JWT
        role=SETTLEMENT com TTL curto. Ver ADR 0004.'
      parameters:
      - description: credenciais de serviço
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Token de serviço (client-credentials)
      tags:
      - auth
  /settlement/transfers:
    get:
      parameters:
      - description: PENDING, SETTLED ou FAILED
        in: query
        name: status
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar transferências por status (SETTLEMENT)
      tags:
      - settlement
  /transfers:
    get:
      parameters:
      - description: PENDING, SETTLED ou FAILED
        in: query
        name: status
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar minhas transferências por status
      tags:
      - transfers
    post:
      consumes:
      - application/json
      parameters:
      - description: chave de idempotência
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: origem, destino e valor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/transfer.transferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/transfer.Transfer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Transferência atômica entre contas
      tags:
      - transfers
  /transfers/{id}:
    get:
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transfer.Transfer'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Consultar transferência
      tags:
      - transfers
  /transfers/{id}/fail:
    patch:
      description: PENDING→FAILED com estorno append-only. Repetir sobre FAILED é
        no-op idempotente (200). Sobre SETTLED retorna 409 com error.code=FAIL_ON_SETTLED.
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transfer.Transfer'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: error.code=FAIL_ON_SETTLED
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Falhar liquidação com estorno (SETTLEMENT)
      tags:
      - settlement
  /transfers/{id}/settle:
    patch:
      consumes:
      - application/json
      description: PENDING→SETTLED. Repetir sobre SETTLED é no-op idempotente (200).
        Sobre FAILED retorna 409 com error.code=SETTLE_ON_FAILED.
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      - description: referência da liquidação
        in: body
        name: body
        schema:
          $ref: '#/definitions/transfer.settleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transfer.Transfer'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: error.code=SETTLE_ON_FAILED
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Confirmar liquidação (SETTLEMENT)
      tags:
      - settlement
securityDefinitions:
  BearerAuth:
    description: 'Informe o token como: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
