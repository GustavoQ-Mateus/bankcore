basePath: /
definitions:
  internal_account.Account:
    properties:
      balance_cents:
        type: integer
      created_at:
        type: string
      id:
        type: string
      number:
        type: string
      owner_id:
        type: string
      status:
        $ref: '#/definitions/internal_account.Status'
      version:
        type: integer
    type: object
  internal_account.Status:
    enum:
    - ACTIVE
    - BLOCKED
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusBlocked
  internal_account.amountRequest:
    properties:
      amount:
        type: string
    type: object
  internal_account.statusRequest:
    properties:
      status:
        $ref: '#/definitions/internal_account.Status'
    type: object
  internal_auth.Customer:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/internal_auth.Role'
    type: object
  internal_auth.Role:
    enum:
    - CUSTOMER
    - ADMIN
    - SETTLEMENT
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleAdmin
    - RoleSettlement
  internal_auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_auth.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/internal_auth.Role'
    type: object
  internal_auth.tokenRequest:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
    type: object
  internal_simulation.Config:
    properties:
      accounts:
        type: integer
      rate:
        type: integer
      transfers:
        type: integer
      workers:
        type: integer
    type: object
  internal_simulation.Counters:
    properties:
      accepted:
        type: integer
      conflict_exhausted:
        type: integer
      dispatched:
        type: integer
      errors:
        type: integer
      rejected_insufficient:
        type: integer
    type: object
  internal_simulation.Latency:
    properties:
      p50:
        type: number
      p95:
        type: number
    type: object
  internal_simulation.Ledger:
    properties:
      accounts:
        type: integer
      divergent_accounts:
        type: integer
    type: object
  internal_simulation.Phase:
    enum:
    - idle
    - seeding
    - running
    - finished
    - stopped
    type: string
    x-enum-varnames:
    - PhaseIdle
    - PhaseSeeding
    - PhaseRunning
    - PhaseFinished
    - PhaseStopped
  internal_simulation.Stats:
    properties:
      captured_at:
        type: string
      ledger:
        $ref: '#/definitions/internal_simulation.Ledger'
      settlement_latency_ms:
        $ref: '#/definitions/internal_simulation.Latency'
      simulation:
        $ref: '#/definitions/internal_simulation.Status'
      throughput:
        $ref: '#/definitions/internal_simulation.Throughput'
      transfers:
        $ref: '#/definitions/internal_simulation.TransferCounts'
      version_conflicts:
        type: integer
      volume_cents:
        $ref: '#/definitions/internal_simulation.Volume'
    type: object
  internal_simulation.Status:
    properties:
      config:
        $ref: '#/definitions/internal_simulation.Config'
      counters:
        $ref: '#/definitions/internal_simulation.Counters'
      finished_at:
        type: string
      phase:
        $ref: '#/definitions/internal_simulation.Phase'
      run_id:
        type: string
      started_at:
        type: string
    type: object
  internal_simulation.Throughput:
    properties:
      created_per_sec:
        type: integer
      settled_per_sec:
        type: integer
    type: object
  internal_simulation.TransferCounts:
    properties:
      failed:
        type: integer
      pending:
        type: integer
      settled:
        type: integer
    type: object
  internal_simulation.Volume:
    properties:
      pending:
        type: integer
      settled:
        type: integer
    type: object
  internal_simulation.startRequest:
    properties:
      accounts:
        type: integer
      rate:
        type: integer
      transfers:
        type: integer
      workers:
        type: integer
    type: object
  internal_transfer.Status:
    enum:
    - PENDING
    - SETTLED
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusSettled
    - StatusFailed
  internal_transfer.Transfer:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      from_account_id:
        type: string
      id:
        type: string
      settled_at:
        type: string
      settlement_ref:
        type: string
      status:
        $ref: '#/definitions/internal_transfer.Status'
      to_account_id:
        type: string
    type: object
  internal_transfer.settleRequest:
    properties:
      settlement_ref:
        type: string
    type: object
  internal_transfer.transferRequest:
    properties:
      amount:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Núcleo bancário em Go: contas, depósitos, saques e transferências
    atômicas com ledger append-only. Valores entram/saem em decimal e são operados
    em centavos int64. v1.1.0 adiciona a fronteira de liquidação com o Liquida (ADR
    0004); v1.2.0 fecha o cadastro público de administrador (gate ALLOW_PUBLIC_ADMIN_REGISTER
    + seed do 1º admin); v1.3.0 adiciona o simulador de carga e as estatísticas do
    dashboard (SIMULATION_ENABLED, ADR 0005).'
  title: BankCore API
  version: 1.3.0
paths:
  /accounts:
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_account.Account'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Abrir conta
      tags:
      - accounts
  /accounts/{id}:
    get:
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.Account'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Consultar conta e saldo
      tags:
      - accounts
  /accounts/{id}/deposit:
    post:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: valor decimal
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_account.amountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Depósito
      tags:
      - accounts
  /accounts/{id}/statement:
    get:
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Extrato paginado
      tags:
      - accounts
  /accounts/{id}/withdraw:
    post:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: valor decimal
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_account.amountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Saque
      tags:
      - accounts
  /admin/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_account.Account'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar contas (ADMIN)
      tags:
      - admin
  /admin/accounts/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: novo status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_account.statusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.Account'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Bloquear/desbloquear conta (ADMIN)
      tags:
      - admin
  /admin/service-clients:
    post:
      description: Gera client_id/client_secret para o Liquida. O client_secret é
        exibido UMA ÚNICA VEZ.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Provisionar credencial de serviço (ADMIN)
      tags:
      - admin
  /admin/transfers:
    get:
      parameters:
      - description: PENDING, SETTLED ou FAILED
        in: query
        name: status
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar transferências por status (ADMIN)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login e emissão de JWT
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: dados do cliente
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Registrar cliente
      tags:
      - auth
  /auth/token:
    post:
      consumes:
      - application/json
      description: 'Fluxo M2M do Liquida: troca client_id/client_secret por um JWT
        role=SETTLEMENT com TTL curto. Ver ADR 0004.'
      parameters:
      - description: credenciais de serviço
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Token de serviço (client-credentials)
      tags:
      - auth
  /settlement/transfers:
    get:
      description: Com status=PENDING lista só as transferências que já têm lançamentos
        (dinheiro movido).
      parameters:
      - description: PENDING, SETTLED ou FAILED
        in: query
        name: status
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar transferências por status (SETTLEMENT)
      tags:
      - settlement
  /simulation/start:
    post:
      consumes:
      - application/json
      description: 'Recurso de demonstração (SIMULATION_ENABLED=true), sem autenticação
        (ADR 0005). Campos omitidos usam o default. Limites: accounts 2..500, transfers
        1..100000, rate 1..500, workers 1..64. Execução ativa retorna 409 com error.code=SIMULATION_RUNNING.'
      parameters:
      - description: configuração da execução
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_simulation.startRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_simulation.Status'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: error.code=SIMULATION_RUNNING
          schema:
            additionalProperties: true
            type: object
      summary: Iniciar simulação de carga
      tags:
      - simulation
  /simulation/stats:
    get:
      description: Agregados do banco num snapshot coerente. transfers.pending e volume_cents.pending
        contam só PENDING com lançamentos. Valores monetários em centavos.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_simulation.Stats'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Estatísticas para o dashboard
      tags:
      - simulation
  /simulation/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_simulation.Status'
      summary: Estado da simulação
      tags:
      - simulation
  /simulation/stop:
    post:
      description: Cancela a execução ativa sem interromper transferências em andamento
        e responde já em stopped. Sem execução ativa é no-op.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_simulation.Status'
      summary: Parar simulação
      tags:
      - simulation
  /transfers:
    get:
      parameters:
      - description: PENDING, SETTLED ou FAILED
        in: query
        name: status
        required: true
        type: string
      - description: página
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar minhas transferências por status
      tags:
      - transfers
    post:
      consumes:
      - application/json
      parameters:
      - description: chave de idempotência
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: origem, destino e valor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_transfer.transferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_transfer.Transfer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Transferência atômica entre contas
      tags:
      - transfers
  /transfers/{id}:
    get:
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transfer.Transfer'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Consultar transferência
      tags:
      - transfers
  /transfers/{id}/fail:
    patch:
      description: PENDING→FAILED com estorno append-only. Repetir sobre FAILED é
        no-op idempotente (200). Sobre SETTLED retorna 409 com error.code=FAIL_ON_SETTLED.
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transfer.Transfer'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: error.code=FAIL_ON_SETTLED
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Falhar liquidação com estorno (SETTLEMENT)
      tags:
      - settlement
  /transfers/{id}/settle:
    patch:
      consumes:
      - application/json
      description: PENDING→SETTLED. Repetir sobre SETTLED é no-op idempotente (200).
        Sobre FAILED retorna 409 com error.code=SETTLE_ON_FAILED. Sobre PENDING ainda
        sem lançamentos retorna 409 com error.code=TRANSFER_NOT_BOOKED.
      parameters:
      - description: transfer id
        in: path
        name: id
        required: true
        type: string
      - description: referência da liquidação
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_transfer.settleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transfer.Transfer'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: error.code=SETTLE_ON_FAILED ou TRANSFER_NOT_BOOKED
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Confirmar liquidação (SETTLEMENT)
      tags:
      - settlement
securityDefinitions:
  BearerAuth:
    description: 'Informe o token como: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
