services:
  postgres:
    image: postgres:16-alpine
    container_name: bankcore-postgres
    environment:
      POSTGRES_USER: bankcore
      POSTGRES_PASSWORD: bankcore
      POSTGRES_DB: bankcore
    ports:
      - "5433:5432"
    volumes:
      - bankcore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankcore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bankcore-net

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://bankcore:bankcore@postgres:5432/bankcore?sslmode=disable"
      - "up"
    networks:
      - bankcore-net

  api:
    build: .
    container_name: bankcore-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://bankcore:bankcore@postgres:5432/bankcore?sslmode=disable"
      JWT_SECRET: "dev-insecure-secret-change-me"
      JWT_TTL: "24h"
      SERVICE_JWT_TTL: "15m"
      LIQUIDA_INTEGRATION: "external"
      BCRYPT_COST: "10"
    ports:
      - "8081:8080"
    networks:
      - bankcore-net

volumes:
  bankcore_pgdata:

networks:
  bankcore-net:
    name: bankcore-net
    driver: bridge
